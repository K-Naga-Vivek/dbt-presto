name: Mend Scan

on:
  push:
    branches:
      - vul_mixcase_fix
  pull_request:
    branches:
      - vul_mixcase_fix

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install Mend CLI
        run: pip install mend-cli

      - name: Run Mend Scan
        run: mend-cli scan --format json --output mend-report.json

      - name: Upload Mend Report
        uses: actions/upload-artifact@v3
        with:
          name: mend-report
          path: mend-report.json
